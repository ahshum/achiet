[package]
name = "achiet"
version = "0.0.1"
edition = "2021"

[dependencies]
argon2 = "0.5.3"
axum = { version = "0.7.7", features = ["tokio", "http1", "http2", "json"] }
chrono = { version = "0.4.38", features = ["serde"] }
env_logger = "0.11.5"
jsonwebtoken = "9.3.0"
log = "0.4.22"
serde = "1.0.210"
serde_json = "1.0.128"
sqlx = { version = "0.8.2", features = ["chrono", "runtime-tokio", "sqlite"] }
tokio = { version = "1.41.0", features = ["rt", "macros", "rt-multi-thread"] }
ulid = "1.1.3"
