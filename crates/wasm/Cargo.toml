[package]
name = "achiet-wasm"
version = "0.0.1-beta.1"
edition = "2021"

[dependencies]
gloo-net = { version = "0.6.0", features = ["http", "json"], default-features = false }
gloo-storage = "0.3.0"
log = "0.4.22"
serde = { version = "1.0.217", features = ["derive"] }
serde_qs = "0.13.0"
wasm-bindgen = "0.2.99"
wasm-bindgen-futures = "0.4.49"
wasm-log = "0.3.1"
web-sys = "0.3.76"
yew = { version = "0.21.0", features = ["csr"] }
yew-router = "0.18.0"
